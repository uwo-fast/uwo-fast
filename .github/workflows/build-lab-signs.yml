name: Build Lab Signs

on:
  pull_request:
    paths:
      - "lab-signs/**"
      - "scripts/**"
      - "templates/**"
      - "branding/logos/**"
      - "requirements.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-lab-signs.yml"
  push:
    branches:
      - main
    paths:
      - "lab-signs/**"
      - "scripts/**"
      - "templates/**"
      - "branding/logos/**"
      - "requirements.txt"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-lab-signs.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build PDF signs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install system PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-latex-recommended texlive-latex-extra texlive-luatex texlive-fonts-recommended

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build lab sign PDFs
        run: python scripts/build_lab_signs.py --all

      - name: Upload lab sign PDFs
        uses: actions/upload-artifact@v7
        with:
          name: lab-signs-pdf
          path: |
            output/lab-signs
            artifacts/lab-signs
